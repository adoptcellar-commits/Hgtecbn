            height: 18px;
            cursor: pointer;
        }
        .action-bar {
            text-align: center;
            margin-top: 25px;
        }

            background-color: #3498db;

            border: none;

            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;

            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;

            margin-top: 0;
            color: #2c3e50;
        }
        .review-item p {
            line-height: 1.6;
            color: #475569;
            margin-bottom: 0;
        }

            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 1px solid #e1e8ed;
        }
        .timer {
            color: #e74c3c;
            font-size: 18px;
        }

            margin-bottom: 20px;

<body>

<div class="container">
    <h1>📚 國中社會科跨單元互動測驗系統</h1>
    <div class="subtitle">六大單元具備 210 題獨立不重複題庫，每次測驗隨機抽題！</div>
    
    <div id="selection-section">
        <p style="font-weight: bold; color: #334155;">請勾選您想要練習的單元（可複選，系統將依規則分配 25 題）：</p>
        <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="unit" value="history1"> 📜 歷史 U1-商至隋唐的國家與社會</label>
            <label class="checkbox-label"><input type="checkbox" name="unit" value="history2"> 🗡️ 歷史 U2-商至隋唐的民族與文化</label>
            <label class="checkbox-label"><input type="checkbox" name="unit" value="geo1"> ⛰️ 地理 U1-中國的地形</label>
            <label class="checkbox-label"><input type="checkbox" name="unit" value="geo2"> 🌧️ 地理 U2-中國的氣候</label>
            <label class="checkbox-label"><input type="checkbox" name="unit" value="civic1"> 🏛️ 公民 U1-國家與民主政治</label>
            <label class="checkbox-label"><input type="checkbox" name="unit" value="civic2"> ⚖️ 公民 U2-憲法與權利保障</label>
        </div>
        <div style="text-align: center; margin: 15px 0;">
            <button type="button" onclick="selectAllUnits()" style="padding: 6px 15px; background: #64748b; color: #fff; border: none; border-radius: 4px; cursor: pointer;">全選所有單元</button>
            <button type="button" onclick="clearAllUnits()" style="padding: 6px 15px; background: #94a3b8; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;">取消全選</button>
        </div>
        <div class="action-bar">
            <button class="next-btn" onclick="goToReviewPage()">下一步：查看複習筆記 ➔</button>
        </div>

        <div class="leaderboard-section">
            <h3>🏆 跨單元綜合英雄榜</h3>
            <div id="global-lb-content">尚無測驗紀錄</div>
        </div>
    </div>

    <div id="review-section" class="hidden">
        <h2 style="color: #2c3e50; text-align: center;">📖 您所選單元的專屬複習筆記</h2>
        <div id="review-notes-container"></div>
        <div class="action-bar" style="display: flex; justify-content: center; gap: 15px;">
            <button class="next-btn" style="background-color: #64748b;" onclick="backToSelection()">⬅️ 返回重選單元</button>
            <button class="next-btn" onclick="startQuizFromReview()">開始 25 題測驗 ➔</button>
        </div>
    </div>

    <div id="quiz-section" class="hidden">
        <div class="quiz-header-bar">
            <span id="quiz-unit-title-tag" style="color: #2c3e50;">跨單元綜合測驗</span>
            <span class="timer">⏳ 剩餘時間：<span id="time-left">25:00</span></span>
        </div>
        <div id="quiz-container"></div>
        <button id="submit-quiz-btn" class="submit-btn" onclick="submitQuiz()">交卷看成績與詳細解析</button>
        <div id="result-container"></div>
    </div>
</div>

                { q: "下列哪一項權利屬於憲法中所規定的『自由權』範疇？", options: ["(A) 言論自由與集會結社自由", "(B) 參與總統大選投票的權利", "(C) 請求國家給予低收入戶補助的權利", "(D) 參加國家公務人員考試的權利"], ans: 0, exp: "言論與集會結社屬於自由權。" },
                { q: "下列哪一項權利屬於憲法規定的『受益權』範疇？", options: ["(A) 受國民教育的權利與提起訴訟請求救濟的權利", "(B) 遷徙到外縣市居住的自由", "(C) 組織政黨的自由", "(D) 登記參選立法委員的權利"], ans: 0, exp: "受教權與訴訟權屬於受益權。" },

                { q: "下列哪一個原則要求國家限制人民權利時，所採取的手段必須是有效且對人民侵害最小的？", options: ["(A) 比例原則", "(B) 絕對君權原則", "(C) 隨意處分原則", "(D) 秘密審判原則"], ans: 0, exp: "比例原則規範公權力侵害人民權利之限度。" },

                { q: "下列哪一項法律是由立法院立法通過、總統公布的？", options: ["(A) 民法、刑法、道路交通管理處罰條例（法律）", "(B) 某所國中的學生手冊校規", "(C) 某個社區大樓的管理委員會規約", "(D) 公司內部的人事考勤辦法"], ans: 0, exp: "民法與刑法屬於國家正式法律。" },
                { q: "下列哪一個機關擁有全國性『法律』的制定與修改權？", options: ["(A) 立法院", "(B) 行政院各部會", "(C) 各直轄市政府", "(D) 最高法院法官"], ans: 0, exp: "立法院為我國最高立法機關。" },

                { q: "下列關於人民義務的敘述，何者正確？", options: ["(A) 人民有依法納稅與接受國民教育的義務", "(B) 人民没有任何義務，只有絕對無限的權利", "(C) 納稅與服兵役是完全自由選擇、不繳也沒關係的事", "(D) 義務是由人民自己隨興決定的"], ans: 0, exp: "納稅與受教（及服兵役）為憲法規定之國民基本義務。" },
                { q: "當人民的基本權利遭受國家不法侵害時，依據受益權中的哪一項權利可以向法院提起訴訟來尋求救濟？", options: ["(A) 訴訟權", "(B) 投票權", "(C) 遷徙權", "(D) 結社權"], ans: 0, exp: "訴訟權讓人民有告官或向法院請求裁判救濟的權利。" },
                { q: "下列哪一個選項不屬於憲法明文規定的基本人權？", options: ["(A) 享有隨意搶奪他人財產的自由", "(B) 人身自由", "(C) 居住遷徙自由", "(D) 言論與學術自由"], ans: 0, exp: "搶奪他人財產違法，不屬於人權保障範圍。" },
                { q: "下列關於『法律保留原則』的敘述，何者正確？", options: ["(A) 限制人民權利的重要事項，必須要有『法律』的授權或依據才能限制", "(B) 行政機關可以不用經過立法院同意，隨意訂定法規剝奪人民所有財產", "(C) 警察可以用自己的規定直接判處死刑", "(D) 總統可以用個人書信更改刑法規定"], ans: 0, exp: "法律保留原則要求限制人權須有法律依據。" },
                { q: "下列哪一個機構負責審查中央法規命令是否有違法或牴觸憲法的情事？", options: ["(A) 立法院與司法機關（憲法法庭）", "(B) 國防部總政治作戰局", "(C) 經濟部工業局", "(D) 台北市公園路燈管理處"], ans: 0, exp: "國會監督與憲法法庭審查可判定命令是否違法違憲。" },
                { q: "下列哪一項權利展現了人民參與國家政策與公共事務的直接表現？", options: ["(A) 參政權中的選舉、罷免、創制、複決", "(B) 在家睡覺的自由權", "(C) 請求國家救助的受益權", "(D) 享有一律平等的平等權"], ans: 0, exp: "參政權包含公民四大民主權利。" },
                { q: "下列有關我國法律體系金字塔結構的敘述，何者正確？", options: ["(A) 頂端是憲法，中間是法律，底層是命令", "(B) 頂端是行政命令，底層是憲法", "(C) 所有法律位階完全平等，沒有高低之分", "(D) 地方自治法規位階高於國家憲法"], ans: 0, exp: "法律位階金字塔由上而下為憲法、法律、命令。" },
                { q: "下列哪一項行為屬於行使『參政權』？", options: ["(A) 參與立法委員選舉投票", "(B) 申請低收入戶生活補助金", "(C) 享有宗教信仰自由", "(D) 主張男女法律地位平等"], ans: 0, exp: "投票選舉屬於參政權。" },
                { q: "下列哪一項行為屬於行使『受益權』中的受教權？", options: ["(A) 適齡國民接受國民義務教育", "(B) 參選里長選舉", "(C) 組織反對黨", "(D) 享有集會遊行自由"], ans: 0, exp: "受國民教育屬於受益權。" },
                { q: "下列關於『平等權』的內涵，何者正確？", options: ["(A) 禁止基於合理性以外的差別待遇，如男女、貧富不應成為不合理歧視的理由", "(B) 所有人不管表現如何，考試成績與薪水必須完全一模一樣", "(C) 國家可以任意規定某個省份的人民全部為奴隸", "(D) 平等權代表任何人犯法都可以免除刑責"], ans: 0, exp: "平等權禁止不合理的差別待遇，但容許基於實質公平的合理差別對待。" },
                { q: "下列關於憲法修改程序（修憲）的敘述，與一般普通法律相比，具有哪一種特點？", options: ["(A) 修憲程序比普通法律更為嚴格繁複", "(B) 修憲程序比買早餐還簡單快速", "(C) 只要行政院長一個人簽名就可以修改憲法", "(D) 憲法永遠不能有任何字動變更"], ans: 0, exp: "憲法為根本大法，其修改程序相當嚴格。" },
                { q: "下列哪一項權利主要是為了確保人民在刑事訴訟中能獲得公平審判、免於遭受不正當刑求？", options: ["(A) 人身自由與訴訟權保障", "(B) 參政權中的罷免權", "(C) 受益權中的工作權", "(D) 經濟上的平等權"], ans: 0, exp: "人身自由與訴訟權保障司法程序正義。" },
                { q: "當行政機關發布的『行政命令』內容明顯與立法院通過的『法律』牴觸時，該命令的命運為何？", options: ["(A) 無效", "(B) 效力自動升格為法律", "(C) 取代法律成為最高規範", "(D) 效力不受影響"], ans: 0, exp: "下位法不得牴觸上位法，牴觸者無效。" },
                { q: "下列關於人民『基本權利與義務』的關係，何者正確？", options: ["(A) 權利與義務相輔相成，享有權利的同時也必須盡相對的義務", "(B) 有權利就絕對不需要盡任何義務", "(C) 有義務的人完全沒有任何基本人權", "(D) 權利與義務毫無關聯"], ans: 0, exp: "公民在享受權利時也須盡納稅、受教等義務。" },
                { q: "下列哪一個機構有權透過憲法法庭宣告法律或命令『違憲失效』？", options: ["(A) 司法院憲法法庭", "(B) 內政部警政署", "(C) 台北地方法院簡易庭", "(D) 法務部調查局"], ans: 0, exp: "憲法法庭負責審查並宣告違憲法規失效。" },
                { q: "下列哪一項選項最能完整體現我國憲法保障人民權利的最高價值？", options: ["(A) 維護人性尊嚴、保障基本人權與限制政府權力", "(B) 賦予政府無限擴權的絕對專制力量", "(C) 讓少數特權階級享有不受法律約束的特權", "(D) 廢除所有法院與法律"], ans: 0, exp: "憲法核心價值在於維護人性尊嚴與保障人權。" }
            ]
        }
    };

    let selectedUnits = [];
    let currentQuestions = [];
    let timerInterval = null;
    let secondsLeft = 1500;

    function selectAllUnits() {
        document.querySelectorAll('input[name="unit"]').forEach(cb => cb.checked = true);
    }
    function clearAllUnits() {
        document.querySelectorAll('input[name="unit"]').forEach(cb => cb.checked = false);
    }

    function goToReviewPage() {
        selectedUnits = [];
        document.querySelectorAll('input[name="unit"]:checked').forEach(cb => {
            selectedUnits.push(cb.value);
        });

        if (selectedUnits.length === 0) {
            alert("⚠️ 請至少勾選一個單元！");
            return;
        }

        document.getElementById('selection-section').classList.add('hidden');
        document.getElementById('review-section').classList.remove('hidden');

        let notesHtml = "";
        selectedUnits.forEach(uKey => {
            let u = unitData[uKey];
            notesHtml += `
                <div class="review-item">
                    <h3>📖 ${u.title}</h3>
                    <p>${u.review}</p>
                </div>
            `;
        });
        document.getElementById('review-notes-container').innerHTML = notesHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function backToSelection() {
        document.getElementById('review-section').classList.add('hidden');
        document.getElementById('selection-section').classList.remove('hidden');
    }

    function startQuizFromReview() {
        currentQuestions = [];
        let n = selectedUnits.length;
        let quotas = [];

        if (n === 1) {
            quotas = [25];
        } else if (n === 2) {
            quotas = [12, 13];
        } else if (n === 3) {
            quotas = [8, 8, 9];
        } else if (n === 4) {
            quotas = [6, 6, 6, 7];
        } else if (n === 5) {
            quotas = [5, 5, 5, 5, 5];
        } else if (n === 6) {
            quotas = [4, 4, 4, 4, 4, 5];
        }

        let shuffledUnits = [...selectedUnits].sort(() => 0.5 - Math.random());

        shuffledUnits.forEach((uKey, index) => {
            let quota = quotas[index];
            let unitPool = [...unitData[uKey].questions].sort(() => 0.5 - Math.random());
            let picked = unitPool.slice(0, quota);
            
            picked.forEach(item => {
                currentQuestions.push({
                    unitName: unitData[uKey].title.split(' - ')[0],
                    q: item.q,
                    options: item.options,
                    ans: item.ans,
                    exp: item.exp
                });
            });
        });

        currentQuestions.sort(() => 0.5 - Math.random());

        document.getElementById('review-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        document.getElementById('quiz-unit-title-tag').innerText = `已選 ${selectedUnits.length} 個單元（共 ${currentQuestions.length} 題獨立不重複測驗）`;

        let quizContainer = document.getElementById('quiz-container');
        quizContainer.innerHTML = "";
        currentQuestions.forEach((q, index) => {
            let optionsHtml = "";
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label>
                        <input type="radio" name="question_${index}" value="${optIndex}"> ${opt}
                    </label>
                `;
            });

            quizContainer.innerHTML += `
                <div class="question-card" id="card_${index}">
                    <div class="question-title">第 ${index + 1} 題：[${q.unitName}] ${q.q}</div>
                    <div class="options">${optionsHtml}</div>
                    <div id="exp_${index}" class="explanation hidden"><strong>詳細解析：</strong> ${q.exp}</div>
                </div>
            `;
        });

        secondsLeft = 1500;
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateTimer() {
        let m = Math.floor(secondsLeft / 60);
        let s = secondsLeft % 60;
        document.getElementById('time-left').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            alert("⏰ 測驗時間到！系統將自動交卷。");
            submitQuiz();
        }
        secondsLeft--;
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        let score = 0;
        let correctCount = 0;

        currentQuestions.forEach((q, index) => {
            let radios = document.getElementsByName(`question_${index}`);
            let userSelected = -1;
            for (let r of radios) {
                if (r.checked) userSelected = parseInt(r.value);
            }

            let card = document.getElementById(`card_${index}`);
            let exp = document.getElementById(`exp_${index}`);
            exp.classList.remove('hidden');

            if (userSelected === q.ans) {
                score += Math.round(100 / currentQuestions.length * 100) / 100;
                correctCount++;
                card.style.borderLeft = "6px solid #2ecc71";
            } else {
                card.style.borderLeft = "6px solid #e74c3c";
            }
        });
        score = Math.round(score);

        let timeSpent = 1500 - secondsLeft;
        let mm = Math.floor(timeSpent / 60);
        let ss = timeSpent % 60;
        let timeStr = `${mm}分${ss}秒`;

        saveLeaderboard(score, timeStr);

        let resultContainer = document.getElementById('result-container');
        resultContainer.innerHTML = `
            <div class="result-box">
                🎉 測驗結束！您的總分為：${score} 分<br>
                <span style="font-size: 16px; font-weight: normal; color: #2c3e50;">（答對 ${correctCount} / ${currentQuestions.length} 題，耗時：${timeStr}）</span>
            </div>
            <div class="leaderboard-section">
                <h3>🏆 跨單元綜合英雄榜紀錄</h3>
                <div id="current-lb-list"></div>
            </div>
            <button class="restart-btn" onclick="location.reload()" style="display:block; margin: 20px auto 0 auto;">返回首頁重新測驗</button>
        `;

        renderLeaderboard();
        document.getElementById('submit-quiz-btn').style.display = 'none';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function saveLeaderboard(score, timeStr) {
        let lb = JSON.parse(localStorage.getItem('social_multi_lb_v2') || '[]');
        lb.push({ score: score, time: timeStr, date: new Date().toLocaleDateString(), unitsCount: selectedUnits.length });
        lb.sort((a, b) => b.score - a.score || a.time.localeCompare(b.time));
        lb = lb.slice(0, 5);
        localStorage.setItem('social_multi_lb_v2', JSON.stringify(lb));
    }

    function renderLeaderboard() {
        let lb = JSON.parse(localStorage.getItem('social_multi_lb_v2') || '[]');
        let html = "<ol>";
        if (lb.length === 0) html += "<li>尚無紀錄</li>";
        else {
            lb.forEach(item => {
                html += `<li><b>${item.score} 分</b> （跨 ${item.unitsCount} 個單元 | 耗時：${item.time} - ${item.date}）</li>`;
            });
        }
        html += "</ol>";
        let el = document.getElementById('current-lb-list');
        if(el) el.innerHTML = html;
        let gel = document.getElementById('global-lb-content');
        if(gel) gel.innerHTML = html;
    }
    renderLeaderboard();
</script>
